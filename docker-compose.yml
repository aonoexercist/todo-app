version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: elysia-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elysia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: elysia-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data: